<style>
:root{--bg:#0b0b10;--card:#15151d;--ln:#262633;--tx:#ecebf2;--mu:#9b9bb0;--ac:#e8a24a;--ac2:#f6c477}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}.logo b{color:var(--ac)}
.lang{display:flex;gap:6px}.lang button{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:999px;padding:5px 11px;font:600 12px system-ui;cursor:pointer}
.lang button.on{background:var(--ac);color:#1a1206;border-color:var(--ac)}
.hero{text-align:center;padding:42px 0 26px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:0 0 14px;letter-spacing:-.8px}
.hero h1 span{color:var(--ac)}
.hero p{color:var(--mu);max-width:560px;margin:0 auto 24px;font-size:17px}
.cta{display:inline-block;background:var(--ac);color:#1a1206;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:999px;font-size:16px;border:0;cursor:pointer}
.cta:active{transform:scale(.98)}
.sub{color:var(--mu);font-size:13px;margin-top:12px}
.shots{display:flex;gap:14px;overflow-x:auto;padding:26px 4px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;justify-content:flex-start}
@media(min-width:900px){.shots{justify-content:center;overflow:visible}}
.shots figure{margin:0;flex:0 0 auto;scroll-snap-align:center;text-align:center}
.shots img{display:block;width:200px;height:auto;border-radius:20px;border:1px solid var(--ln);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.shots figcaption{color:var(--mu);font-size:12px;margin-top:8px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:30px 0}
.feat div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.feat b{display:block;margin-bottom:4px}.feat span{color:var(--mu);font-size:14px}
.how{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:20px;margin:10px 0 24px}
.how h2{margin:0 0 8px;font-size:20px}.how ol{margin:0;padding-left:20px;color:var(--mu)}.how li{margin:6px 0}
.key{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.key input{flex:1 1 200px;max-width:300px;background:#0f0f15;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px 14px;font:16px system-ui}
.key button{background:none;border:1px solid var(--ac);color:var(--ac2);border-radius:12px;padding:12px 18px;font:600 15px system-ui;cursor:pointer}
footer{text-align:center;color:var(--mu);font-size:13px;margin-top:34px}
footer a{color:var(--ac2)}
#priv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg);z-index:9}
#priv .box{max-width:420px;text-align:center}
#priv h2{margin:10px 0 8px;font-size:24px}#priv p{color:var(--mu);margin:0 0 18px}
#priv .big{font-size:46px}
.spin{width:34px;height:34px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.hide{display:none!important}
.ctas{display:flex;flex-direction:column;gap:10px;align-items:center}.cta.alt{background:none;color:var(--ac2);border:1.5px solid var(--ac)}@media(min-width:560px){.ctas{flex-direction:row;justify-content:center}}</style>
</head>

var LS={k:'pt_key',d:'pt_dev',s:'pt_sess',l:'pt_lang'};
function ls(a,k,v){try{if(a==='g')return localStorage.getItem(k);if(a==='s')localStorage.setItem(k,v);if(a==='r')localStorage.removeItem(k)}catch(e){}return null}
var lang=ls('g',LS.l)||((navigator.language||'es').slice(0,2));if(!T[lang])lang='es';
function t(k){return T[lang][k]||T.es[k]||k}
var MU=['livetgn','gmail.com'].join('@');
function paint(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){e.innerHTML=t(e.getAttribute('data-t'))});
  document.querySelectorAll('[data-p]').forEach(function(e){e.placeholder=t(e.getAttribute('data-p'))});
  document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});
  var m=document.getElementById('ctaMail');if(m)m.href='mailto:'+MU+'?subject='+encodeURIComponent(t('mS'))+'&body='+encodeURIComponent(t('mB'));
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;ls('s',LS.l,lang);paint()}});
paint();
if(window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)){var h=document.getElementById('saHint');if(h)h.classList.remove('hide')}

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var priv=$('priv'),box=$('privBox');
function showSpin(){priv.style.display='flex';box.innerHTML='<div class="spin"></div><p>'+esc(t('chk'))+'</p>'}
function showMsg(icon,title,body,opts){
  opts=opts||{};priv.style.display='flex';
  var h='<div class="big">'+icon+'</div><h2>'+esc(title)+'</h2><p>'+esc(body)+'</p>';
  if(opts.ig)h+='<a class="cta" href="'+IG+'" target="_blank" rel="noopener">'+esc(t('ig'))+'</a>';
  if(opts.retry)h+='<p style="margin-top:14px"><button class="cta" id="bRetry">'+esc(t('retry'))+'</button></p>';
  if(opts.other)h+='<p style="margin-top:14px"><a href="#" id="bOther" style="color:var(--ac2)">'+esc(t('other'))+'</a></p>';
  box.innerHTML=h;
  var r=$('bRetry');if(r)r.onclick=function(){start()};
  var o=$('bOther');if(o)o.onclick=function(e){e.preventDefault();ls('r',LS.k);ls('r',LS.s);history.replaceState(null,'',location.pathname);priv.style.display='none'};
}

function devId(){
  var d=ls('g',LS.d);
  if(!d||d.length<8){
    d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));
    ls('s',LS.d,d);
  }
  return d;
}
function getKey(){
  var m=/[?&]k=([^&#]+)/.exec(location.search);
  if(m){var k=decodeURIComponent(m[1]).trim();if(k)return k}
  return ls('g',LS.k)||'';
}
function validate(k){
  var ctrl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){ctrl&&ctrl.abort()},9000);
  return fetch(SB_URL+'/rest/v1/rpc/validar_acceso',{
    method:'POST',signal:ctrl?ctrl.signal:undefined,
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    body:JSON.stringify({p_clave:k,p_device:devId(),p_agente:(navigator.userAgent||'').slice(0,160)})
  }).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('http '+r.status);return r.json()});
}
function b64(u){var s=atob(u),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function decrypt(llave,file){
  var res=await fetch(file||'app.enc',{cache:'no-cache'});
  if(!res.ok)throw new Error('enc '+res.status);
  var buf=new Uint8Array(await res.arrayBuffer());
  var kh=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(llave));
  var key=await crypto.subtle.importKey('raw',kh,'AES-GCM',false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  var ds=new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip')));
  return await ds.text();
}
async function launch(llave,llaveA){
  var html=await decrypt(llave);
  // Herramientas de apoyo: solo llegan (cifradas aparte) a quien tiene el apoyo activado
  if(llaveA){
    try{
      var pj=await decrypt(llaveA,'apoyo.enc');
      var pi=html.indexOf('</head>');
      var ps='<scr'+'ipt>window.KIT_PREMIUM='+pj.replace(/<\//g,'<\\/')+';</scr'+'ipt>';
      html=pi>=0?html.slice(0,pi)+ps+html.slice(pi):ps+html;
    }catch(e){}
  }
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIOS)html=html.replace(/<link[^>]+rel=["']manifest["'][^>]*>/i,'');   // iOS: «Añadir a inicio» guarda esta URL con la clave
  // Latido: mientras la app está abierta avisa cada 2 min de que sigue conectada (para el panel de administrador)
  var hb='<scr'+'ipt>(function(){var U='+JSON.stringify(SB_URL)+',K='+JSON.stringify(SB_KEY)+',C='+JSON.stringify(getKey())+',D='+JSON.stringify(devId())+';'
   +'function p(){if(document.hidden||navigator.onLine===false)return;try{fetch(U+"/rest/v1/rpc/latido",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",apikey:K,Authorization:"Bearer "+K},body:JSON.stringify({p_clave:C,p_device:D})})'
   +'.then(function(r){return r.json()}).then(function(j){if(j&&j.ok===false&&j.motivo==="anulada"){try{localStorage.removeItem("pt_sess")}catch(e){}}}).catch(function(){})}catch(e){}}'
   +'setInterval(p,120000);document.addEventListener("visibilitychange",function(){if(!document.hidden)p()});})();</scr'+'ipt>';
  var ix=html.lastIndexOf('</body>');html=ix>=0?html.slice(0,ix)+hb+html.slice(ix):html+hb;
  document.open();document.write(html);document.close();
}
var starting=false,userGo=false;
var UA=navigator.userAgent||'';
function inApp(){return /(Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|MicroMessenger|TikTok|musical_ly|Snapchat|Line\/|LinkedInApp|Twitter)/i.test(UA)}
function isBot(){return navigator.webdriver===true||/(bot|crawl|spider|slurp|preview|headless|facebookexternalhit|meta-external|lighthouse)/i.test(UA)}
function showInApp(){
  priv.style.display='flex';
  box.innerHTML='<div class="big">🌐</div><h2>'+esc(t('tApp'))+'</h2><p>'+esc(t('bApp'))+'</p><p style="font-size:14px">'+esc(t('sApp1'))+'<br>'+esc(t('sApp2'))+'</p><p><button class="cta" id="bCopy">'+esc(t('cpy'))+'</button></p>';
  $('bCopy').onclick=function(){var b=this,u=location.href,ok=function(){b.textContent=t('cpd');setTimeout(function(){b.textContent=t('cpy')},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,function(){});else{var x=document.createElement('textarea');x.value=u;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(x)}};
}
function showEnter(){
  priv.style.display='flex';
  box.innerHTML='<div class="big">🔑</div><h2>'+esc(t('tEnt'))+'</h2><p>'+esc(t('bEnt'))+'</p><button class="cta" id="bGo">'+esc(t('goBtn'))+'</button>';
  $('bGo').onclick=function(){userGo=true;start()};
}
async function start(){
  if(starting)return;starting=true;
  try{
    var k=getKey();
    if(!k){starting=false;return}                      // sin clave: se queda la portada
    var sess=null;try{sess=JSON.parse(ls('g',LS.s)||'null')}catch(e){}
    var known=!!(sess&&sess.k===k&&sess.llave);        // este dispositivo ya se validó antes
    if(!known){
      if(isBot()){return}                              // robots y vistas previas: nada, ni se registran
      if(inApp()){showInApp();return}                  // navegador interno (Instagram...): no se registra
      if(!userGo){showEnter();return}                  // dispositivo nuevo: solo cuenta cuando la persona toca el botón
    }
    showSpin();
    var r=null,netFail=false;
    try{r=await validate(k)}catch(e){netFail=true}
    if(netFail){
      if(sess&&sess.k===k&&sess.llave&&(Date.now()-sess.ts)<GRACE_DAYS*864e5){
        try{await launch(sess.llave,sess.llaveA);return}catch(e){showMsg('⚠️',t('tErr'),t('bErr'),{retry:true});return}
      }
      showMsg('📡',t('tNet'),t('bNet'),{retry:true});return;
    }
    if(r&&r.ok){
      ls('s',LS.k,k);ls('s',LS.s,JSON.stringify({k:k,llave:r.llave,llaveA:r.llave_apoyo||'',ts:Date.now(),n:r.nombre}));
      try{await launch(r.llave,r.llave_apoyo)}catch(e){
        // sin red para bajar la app: intenta con la caché del navegador
        showMsg('⚠️',t('tErr'),t('bErr'),{retry:true});
      }
      return;
    }
    ls('r',LS.s);
    var m=r&&r.motivo;
    if(m==='navegador_interno'){showInApp();return}
    if(m==='bot'){priv.style.display='none';return}
    if(m==='limite'){ls('r',LS.k);showMsg('📱',t('tLim'),t('bLim').replace('%n',r.max||''),{ig:true,other:true})}
    else if(m==='anulada'){ls('r',LS.k);showMsg('🚫',t('tOff'),t('bOff'),{ig:true,other:true})}
    else{ls('r',LS.k);showMsg('🔑',t('tInv'),t('bInv'),{ig:true,other:true})}
  }finally{starting=false}
}
$('keyForm').onsubmit=function(e){
  e.preventDefault();var v=$('keyIn').value.trim();
  if(!v)return;
  var m=/[?&]k=([^&#\s]+)/.exec(v);if(m)v=decodeURIComponent(m[1]);
  ls('s',LS.k,v);userGo=true;history.replaceState(null,'','?k='+encodeURIComponent(v));start();
};
start();
})();
</script>
